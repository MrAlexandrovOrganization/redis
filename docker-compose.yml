networks:
  redis-net:
    name: redis-net
    driver_opts:
      com.docker.network.driver.mtu: "1376"

services:
  redis:
    container_name: "${CONTAINER_NAME_PREFIX:-}redis"
    hostname: redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - redis-net
    extends:
      file: docker-compose.base.yml
      service: base

  redisinsight:
    container_name: "${CONTAINER_NAME_PREFIX:-}redisinsight"
    image: redis/redisinsight:3.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis
    networks:
      - redis-net

    extends:
      file: docker-compose.base.yml
      service: base

    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  redis_data:
  redisinsight_data:
